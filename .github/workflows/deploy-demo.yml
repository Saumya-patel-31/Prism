name: Deploy demo

# Publishes the static demo to S3 + CloudFront.
#
# Authentication is keyless: `id-token: write` lets GitHub mint an OIDC token,
# which AWS exchanges for credentials that expire in an hour. No AWS access key
# is stored in repository secrets.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/build-demo-static.mjs"
      - "next.config.ts"
      - "package-lock.json"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# Least privilege for the token itself.
permissions:
  contents: read
  id-token: write

# A newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build static demo
        run: npm run build:demo:static
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      # TEMPORARY — remove once OIDC is confirmed working.
      # Prints the claims AWS compares against the role's trust policy. Only
      # the decoded claims are echoed, never the token itself.
      - name: Debug OIDC claims
        run: |
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            | jq -r '.value')
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          while [ $(( ${#PAYLOAD} % 4 )) -ne 0 ]; do PAYLOAD="${PAYLOAD}="; done
          echo "$PAYLOAD" | base64 -d 2>/dev/null \
            | jq '{sub, aud, iss, repository, ref, workflow_ref}'

      # The role ARN is an identifier, not a credential — the trust policy is
      # what enforces who may assume it. Inlining removes the repository secret
      # as a source of error.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::288507842287:role/prism-demo-github-deploy
          role-session-name: github-actions-prism-demo
          audience: sts.amazonaws.com
          aws-region: us-east-1

      # Hashed asset filenames under _next/static are immutable, so they get a
      # long cache. Everything else must revalidate or users would be pinned to
      # a stale HTML shell after a deploy.
      - name: Upload immutable assets
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "*" \
            --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML and the rest
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_ID }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "Deployed to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
