name: Deploy demo

# Publishes the static demo to S3 + CloudFront.
#
# Authentication is keyless: `id-token: write` lets GitHub mint an OIDC token,
# which AWS exchanges for credentials that expire in an hour. No AWS access key
# is stored in repository secrets.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "scripts/build-demo-static.mjs"
      - "next.config.ts"
      - "package-lock.json"
      - ".github/workflows/deploy-demo.yml"
  workflow_dispatch:

# Least privilege for the token itself.
permissions:
  contents: read
  id-token: write

# A newer push supersedes an in-flight deploy.
concurrency:
  group: deploy-demo
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and publish
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build static demo
        run: npm run build:demo:static
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      # Hashed asset filenames under _next/static are immutable, so they get a
      # long cache. Everything else must revalidate or users would be pinned to
      # a stale HTML shell after a deploy.
      - name: Upload immutable assets
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "*" \
            --include "_next/static/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload HTML and the rest
        run: |
          aws s3 sync out/ "s3://${{ secrets.AWS_S3_BUCKET }}/" \
            --delete \
            --exclude "_next/static/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ secrets.AWS_CLOUDFRONT_ID }}" \
            --paths "/*"

      - name: Summary
        run: |
          echo "Deployed to ${{ vars.SITE_URL }}" >> "$GITHUB_STEP_SUMMARY"
